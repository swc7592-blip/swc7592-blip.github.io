title: Macro Claw
description: 매크로 경제 & OpenClaw 활용 가이드
author: thanksdany
lang: ko
timezone: Asia/Seoul

# 주소가 두 번 겹치는 것을 막아주는 핵심 코드입니다!
url: "https://swc7592-blip.github.io"
baseurl: ""

theme: minima

header_pages:
  - index.md

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

defaults:
  - scope:
      path: ""
      type: "posts"
