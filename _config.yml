  - vendor/bundle/
  - vendor/cache/
  - .github/
  - agents/
  - memory/
  - skills/
  - AGENTS.md
  - BOOTSTRAP.md
  - HEARTBEAT.md
  - IDENTITY.md
  - SOUL.md
  - TOOLS.md
  - USER.md
  - Gemfile
  - Gemfile.lock
