title: Macro Claw
description: 매크로 경제 & OpenClaw 활용 가이드
author: thanksdany
lang: ko
timezone: Asia/Seoul

# URL 설정 (글 링크 오류를 해결해 줍니다!)
url: "https://swc7592-blip.github.io"
baseurl: ""

theme: minima

header_pages:
  - index.md

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# 포스트 기본 설정 (글 클릭 시 정상적인 페이지로 넘어가게 해줍니다!)
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post

exclude:
  - vendor/
  - vendor/bundle/
  - vendor/cache/
  - .github/
  - agents/
  - memory/
  - skills/
  - AGENTS.md
  - BOOTSTRAP.md
  - HEARTBEAT.md
  - IDENTITY.md
  - SOUL.md
  - TOOLS.md
  - USER.md
  - Gemfile
  - Gemfile.lock
